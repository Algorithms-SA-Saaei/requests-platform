# إعدادات التمرير المشتركة — التركيب: /etc/nginx/snippets/marhab-proxy.conf
proxy_http_version 1.1;

# تمرير هوية الطلب والزائر (§44) — التطبيق يقرأ CF-Connecting-IP أولًا ثم X-Forwarded-For
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
proxy_set_header CF-Ray            $http_cf_ray;   # يُستخدم كمعرّف طلب للتتبّع عبر الطبقات (§50)

# دعم ترقية WebSocket إن احتاجتها أي ميزة مستقبلًا (§39)
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# مهلات: أطول قليلًا من مهلة ساعي في التطبيق (10ث) حتى تصل رسالة الخطأ المهذّبة للمستخدم
proxy_connect_timeout 10s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;

# لا تخزين مؤقت للردود الديناميكية (§74)
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;
