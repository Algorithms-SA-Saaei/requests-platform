# مرحاب — وسيط عكسي أمام Node.js (§39)
# المسار: Cloudflare ← Nginx :443 ← Node :3000 — مسار طلب واحد واضح بلا تعارض (§73)
# التركيب: sudo cp marhab.conf /etc/nginx/sites-available/marhab
#          sudo ln -s /etc/nginx/sites-available/marhab /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# استعادة عنوان الزائر الحقيقي من Cloudflare (§44) — بدونه كل الطلبات تبدو من عنوان واحد
# فينهار حدّ المعدّل وسجلّات التدقيق. حدّث القائمة دوريًا: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# مجمّع اتصالات دائم نحو Node — يقلّل زمن التأسيس تحت التزامن (§15)
upstream marhab_node {
    server 127.0.0.1:3000;
    keepalive 64;
}

# منطقتا حدّ معدّل على مستوى الحافة (طبقة أولى قبل حدود التطبيق)
limit_req_zone $binary_remote_addr zone=marhab_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=marhab_write:10m rate=3r/s;

server {
    listen 80;
    listen [::]:80;
    server_name kiosk.webnan.io;
    # إعادة توجيه HTTP إلى HTTPS (§72) مع إبقاء تحدّي Let's Encrypt يعمل
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiosk.webnan.io;

    # شهادة الأصل — Cloudflare Origin Certificate أو Let's Encrypt (§40)
    ssl_certificate     /etc/ssl/marhab/origin.pem;
    ssl_certificate_key /etc/ssl/marhab/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ترويسات أمنية على مستوى الحافة (Helmet يضيف طبقته في التطبيق — §46)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;      # حد حجم الطلب (§22)
    client_body_timeout 15s;
    send_timeout 30s;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/marhab.access.log;
    error_log  /var/log/nginx/marhab.error.log warn;

    # فحص الصحة — بلا حد معدّل ولا تسجيل ضجيج، لتعمل المراقبة بحرية (§51)
    location = /health       { proxy_pass http://marhab_node; access_log off; }
    location = /health/ready { proxy_pass http://marhab_node; access_log off; }

    # مسارات الكتابة الحسّاسة — حدّ أشد
    location ~ ^/api/(auth/login|clients|notifications/register-token)$ {
        limit_req zone=marhab_write burst=10 nodelay;
        proxy_pass http://marhab_node;
        include /etc/nginx/snippets/marhab-proxy.conf;
    }

    # بقية الواجهة البرمجية
    location /api/ {
        limit_req zone=marhab_general burst=60 nodelay;
        proxy_pass http://marhab_node;
        include /etc/nginx/snippets/marhab-proxy.conf;
    }

    # عامل الخدمة للإشعارات الخلفية — يجب ألا يُخزَّن مؤقتًا وإلا تعطّلت الإشعارات (§75)
    location = /firebase-messaging-sw.js {
        proxy_pass http://marhab_node;
        include /etc/nginx/snippets/marhab-proxy.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location / {
        proxy_pass http://marhab_node;
        include /etc/nginx/snippets/marhab-proxy.conf;
    }
}
